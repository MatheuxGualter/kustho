plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.kustho'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "app.kustho.notificationcapture"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
}

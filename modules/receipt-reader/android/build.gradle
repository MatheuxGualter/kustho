plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.kustho'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "app.kustho.receiptreader"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    // Entram no R8 do app: sem elas o OCR não funciona no APK final.
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  // OCR no aparelho, com o modelo latino embutido no app: nada é enviado para a internet.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  testImplementation 'junit:junit:4.13.2'
}
